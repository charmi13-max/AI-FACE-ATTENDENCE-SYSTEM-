<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="nav">
        <div class="brand">AI Face Attendance</div>
        <div class="links">
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('register') }}">Register</a>
            <a href="{{ url_for('attendance') }}">Attendance</a>
            <a href="{{ url_for('reports') }}">Reports</a>
        </div>
    </nav>

    <main class="container small">
        <h1>Register New Student</h1>

        {% if error %}
        <div class="alert error">{{ error }}</div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data" class="panel">
            <div class="field-group">
                <label>Student ID</label>
                <input type="text" name="student_id" placeholder="e.g. 101" required>
            </div>
            <div class="field-group">
                <label>Name</label>
                <input type="text" name="name" placeholder="Student full name" required>
            </div>
            <div class="field-group">
                <label>Course</label>
                <input type="text" name="course" placeholder="Course name" required>
            </div>
            <div class="field-group">
                <label>Face Photos</label>
                <input type="file" name="photos" multiple accept="image/*" required>
            </div>
            <button type="submit">Save Student</button>
        </form>
    </main>
</body>
</html>
